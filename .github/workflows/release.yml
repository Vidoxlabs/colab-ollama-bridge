name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system testing tools (Bats, ShellCheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install dependencies
        run: uv sync

      - name: Run verification gate
        run: make check

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p dist
          cp scripts/bootstrap.sh dist/
          cp config/model-profiles.json dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
