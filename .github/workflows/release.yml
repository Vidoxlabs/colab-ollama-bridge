name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system testing tools (Bats, ShellCheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install dependencies
        run: uv sync

      - name: Run verification gate
        run: make check

      - name: Validate release tag against pyproject.toml and CHANGELOG.md
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [[ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]]; then
            echo "[ERROR] Git tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($PYPROJECT_VERSION)" >&2
            exit 1
          fi
          if ! grep -q "## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "[ERROR] CHANGELOG.md does not contain section for version $TAG_VERSION" >&2
            exit 1
          fi
          echo "Release tag validation passed: $GITHUB_REF_NAME matches pyproject.toml and CHANGELOG.md."

      - name: Verify embedded runtime manifest digest in bootstrap.sh
        run: |
          EXPECTED_DIGEST=$(sha256sum runtime-SHA256SUMS.txt | awk '{print $1}')
          EMBEDDED_DIGEST=$(grep '^RUNTIME_MANIFEST_SHA256=' scripts/bootstrap.sh | cut -d'"' -f2)
          if [[ "$EXPECTED_DIGEST" != "$EMBEDDED_DIGEST" ]]; then
            echo "[ERROR] Embedded RUNTIME_MANIFEST_SHA256 in scripts/bootstrap.sh ($EMBEDDED_DIGEST) does not match runtime-SHA256SUMS.txt ($EXPECTED_DIGEST)" >&2
            exit 1
          fi
          echo "Runtime manifest embedded digest verified: $EMBEDDED_DIGEST"

      - name: Generate Release Artifacts and Checksums
        run: |
          mkdir -p dist/config dist/src dist/scripts
          cp config/model-profiles.json dist/config/
          cp src/bridge_proxy.py dist/src/
          cp src/supervisor.py dist/src/
          cp scripts/generate-client-config.py dist/scripts/
          cp scripts/bootstrap.sh dist/scripts/
          cp scripts/bootstrap.sh dist/
          cp runtime-SHA256SUMS.txt dist/

          # Package release tarball
          tar -czf "dist/colab-ollama-bridge-${GITHUB_REF_NAME}.tar.gz" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='dist' \
            --exclude='__pycache__' \
            .

          (
            cd dist
            sha256sum \
              "colab-ollama-bridge-${GITHUB_REF_NAME}.tar.gz" \
              bootstrap.sh \
              runtime-SHA256SUMS.txt \
              config/model-profiles.json \
              src/bridge_proxy.py \
              src/supervisor.py \
              scripts/generate-client-config.py > release-SHA256SUMS.txt
            cat release-SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release-SHA256SUMS.txt
            dist/runtime-SHA256SUMS.txt
            dist/colab-ollama-bridge-*.tar.gz
            dist/bootstrap.sh
            dist/config/*
            dist/src/*
            dist/scripts/*
          generate_release_notes: true
